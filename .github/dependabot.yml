version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Security updates always open PRs; version bumps are grouped to keep the noise down.
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
